name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-latest-release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Verify simple Trench workflow
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: python scripts/verify_trench_simple_workflow.py
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean AngleCal.spec
      - name: Write version manifest
        run: python scripts/write_release_manifest.py
      - name: Package batch runner
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runner | Out-Null
          Copy-Item AngleCal.bat,run_angle_cal.py,requirements.txt,pyproject.toml,README.md -Destination runner
          Copy-Item src -Destination runner -Recurse
          Copy-Item build\_build_info.json -Destination runner\src\angle_cal\_build_info.json
          Compress-Archive -Path runner\* -DestinationPath dist\AngleCal-bat.zip -Force
      - name: Verify packaged build identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $infoPath = Join-Path $env:RUNNER_TEMP 'anglecal-packaged.json'
          $process = Start-Process -FilePath "$PWD/dist/AngleCal.exe" -ArgumentList @('--build-info-json', $infoPath) -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(30000)) { throw 'Packaged EXE smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw 'Packaged EXE failed to launch' }
          $info = Get-Content $infoPath -Raw | ConvertFrom-Json
          $manifest = Get-Content dist/version.json -Raw | ConvertFrom-Json
          if ($info.build_commit -ne $env:GITHUB_SHA -or $manifest.commit -ne $env:GITHUB_SHA) { throw 'Wrong packaged commit' }
          if ($info.build_id -ne $manifest.build_id -or $info.app_version -ne $manifest.version) { throw 'Wrong packaged identity' }
          if ((Get-FileHash dist/AngleCal.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $manifest.sha256) { throw 'Wrong packaged hash' }
      - name: Synchronize release source tag
        id: release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch main' }
          if ((git rev-parse origin/main).Trim() -ne $env:GITHUB_SHA) { throw 'Refusing to publish an outdated or non-main build' }
          $previous = git ls-remote origin refs/tags/windows-latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not read release tag' }
          $previousSha = if ($previous) { ($previous -split '\s+')[0] } else { '' }
          git tag --force windows-latest $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare release tag' }
          git push origin refs/tags/windows-latest "--force-with-lease=refs/tags/windows-latest:$previousSha"
          if ($LASTEXITCODE -ne 0) { throw 'Release tag changed concurrently; publication stopped' }
          $metadata = Get-Content build/_build_info.json -Raw | ConvertFrom-Json
          "version=$($metadata.app_version)" >> $env:GITHUB_OUTPUT
          "build_id=$($metadata.build_id)" >> $env:GITHUB_OUTPUT
      - name: Publish executable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: AngleCal v${{ steps.release.outputs.version }} · build ${{ steps.release.outputs.build_id }}
          body: |
            버전 **${{ steps.release.outputs.version }}** · 빌드 **${{ steps.release.outputs.build_id }}**
            소스 커밋: `${{ github.sha }}` (아래 Source code도 동일한 커밋)

            - Windows 실행: **AngleCal.exe**를 다운로드하세요. Python 설치가 필요 없습니다.
            - 배치 실행: **AngleCal-bat.zip**을 내려받아 압축을 풀고 AngleCal.bat를 실행하세요. Python 3.9 이상이 필요합니다.
            - Trench 사용: **썸네일에서 이미지 선택 → 곡선 그리기 또는 구조 불러오기 → 인식**. 별도 영역 지정이 필요 없습니다. Trench 전용 도구줄의 선택·이동·크기 조절·스케일바를 사용할 수 있습니다. 기존 보정값을 이어받으며 CD 깊이 간격은 기본 1nm입니다.
            - Trench 그래프에 양쪽 상단 Field와 입구 전이, 최하단 바닥의 전체 측정 윤곽을 함께 표시합니다. 두 벽 사이 CD와 1nm 측정 간격은 유지합니다.
            - 곡선 중간 클릭으로 점 추가 후 드래그 보정, Alt+드래그로 곡선 이동을 지원하고 그리기 커서를 화살표로 변경했습니다. 기본 Trench 인식과 CD·GFE 좌표를 곡선 인식 범위 내부로 제한합니다.
            - SEM의 넓은 밝기 변화와 완만한 테두리를 곡선 주변 명암으로 추적하고 범위 밖 정보 띠의 영향을 줄였습니다. 일부 경계가 미검출이면 해당 CD 제외와 GFE 복사 제한을 표시합니다.
            - 곡선을 따라 주변 영상의 경계 근거와 후보 경로의 연속성을 함께 평가해 입자 잡음에 의한 벽면 돌출을 줄였습니다. 실제 보우·기울기·홈·입구 원호를 보존하도록 검사하며, 불확실한 구간을 직선으로 채우지 않습니다.
            - 창 제목의 버전·빌드 번호가 이 릴리스와 같은지 확인하세요.
          files: |
            dist/AngleCal.exe
            dist/AngleCal-bat.zip
            dist/version.json
          overwrite_files: true
          make_latest: true
