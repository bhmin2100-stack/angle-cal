name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean AngleCal.spec
      - name: Publish executable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: AngleCal Windows Latest
          body: Download `AngleCal.exe` and double-click it on Windows.
          files: dist/AngleCal.exe
          overwrite_files: true
          make_latest: true
